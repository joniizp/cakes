<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cakes</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 40px 20px;
             background-color: #f4f4f4;
            text-align: center;
        }

        header {
            margin-bottom: 50px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        /* Gallery Grid */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Individual Gallery Item */
        .gallery-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            display: block;
        }

        /* Label styling */
        .label {
            margin-top: 15px;
            font-weight: bold;
            color: #333;
            font-size: 1.1rem;
        }

        .description {
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
        }

    .gallery-item a {
        text-decoration: none;
        color: inherit;
        display: block;
    }
    
    /* hover effect */
    .gallery-item:hover {
        transform: translateY(-5px);
        transition: 0.3s ease;
        cursor: pointer;
    }
    </style>
</head>
<body>

    <header>
        <h1>Cakes</h1>
        <p>Cake and tiramisu designs over the past year.</p>
    </header>

    <div class="gallery">

        <!-- Item with Label -->
        <div class="gallery-item">
            <a href="birthdaycake.html">
            <img src="cake/bday3.JPG">
            </a>
            <div class="label">Birthday cake</div>
            <div class="description">I made my own birthday cake this year.</div>
        </div>

        <!-- Item with Label -->
        <div class="gallery-item">
            <img src="images/project2.jpg" alt="Description of image 2">
            <div class="label">Project Title Two</div>
            <div class="description">Created in 2024.</div>
        </div>

        <!-- Item without Label (Just the image) -->
        <div class="gallery-item">
            <img src="images/project3.jpg" alt="Description of image 3">
        </div>

    </div>

</body>
</html>
